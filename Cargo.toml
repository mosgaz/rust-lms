[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/ui",
    "crates/icons",
    "crates/client",
    "crates/api",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"
repository = "https://github.com/mosgaz/rust-lms"
authors = ["rust-lms contributors"]

[workspace.dependencies]
# --- Сериализация / контракты ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# --- Асинхронный рантайм / сеть ---
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# HTTP types
http = "1.1"

# --- БД ---
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
sea-orm = { version = "1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# --- Фронтенд ---
# leptos = { version = "0.7", features = ["csr", "ssr"] }
leptos = { version = "0.8.20" }
leptos_router = "0.8.15"
leptos_meta = "0.8.6"
leptos_axum = { version = "0.8" }
tw_merge = { version = "0.1.21", features = ["variant"] }
strum = { version = "0.28.0", features = ["derive"] }
wasm-bindgen = "0.2"
gloo = "0.11"
# web-sys = { version = "0.3" }
web-sys = { version = "0.3", default-features = false, features = [
    "Clipboard", "console", "CssStyleDeclaration", "Document", "DomRect",
    "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "Headers",
    "HtmlElement", "HtmlInputElement", "InputEvent", "KeyboardEvent", "Location",
    "MediaQueryList", "MouseEvent", "MutationObserver", "MutationObserverInit",
    "MutationRecord", "Navigator", "Node", "NodeList", "Request", "RequestInit",
    "RequestMode", "Response", "Storage", "Window",
] }

# --- Идентификаторы / время ---
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde", "formatting", "wasm-bindgen"] }

# --- Ошибки / логирование ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# --- Криптография (Ed25519, лицензии, подписи плагинов) ---
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# --- CLI ---
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.11"

# --- Дизайн-система ---
tailwindcss = "0.1"
