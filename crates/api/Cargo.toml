# crates/api/Cargo.toml
[package]
name = "rust-lms-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Серверное ядро бизнес-логики: PostgreSQL + RLS, LRS, SCIM, ETL, license, features, SBOM"

[dependencies]
rust-lms-shared = { path = "../shared", features = ["server"] }

# Database
sqlx = { workspace = true }
sea-orm = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# UUID
uuid = { workspace = true }

# DateTime
chrono = { workspace = true }

# HTTP framework
axum = { workspace = true, features = ["macros"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }

# HTTP types
http = { workspace = true }

# Authentication
jsonwebtoken = "9.3"
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"

anyhow = { workspace = true }
sha2 = { workspace = true }

# Генерация PDF и QR-кодов
printpdf = "0.7"
qrcode = "0.14"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
serde_json = "1"