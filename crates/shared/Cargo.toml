# crates/shared/Cargo.toml
[package]
name = "rust-lms-shared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Плоские DTO, сущности, контракты обмена и xAPI JSON-LD структуры"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

# sqlx нужен только для серверной части (макрос Type для UUID)
sqlx = { workspace = true, features = ["postgres", "uuid"], optional = true }

[features]
default = []
server = ["dep:sqlx"]